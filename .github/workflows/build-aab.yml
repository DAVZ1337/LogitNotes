name: Build Android AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/my-upload-key.jks"
          test -s "$RUNNER_TEMP/my-upload-key.jks"

      - name: Validate signing key
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          wc -c "$RUNNER_TEMP/my-upload-key.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/my-upload-key.jks" \
            -alias upload \
            -storepass "$STORE_PASSWORD"

      - name: Build signed Android App Bundle
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Find generated AAB
        run: |
          find app/build/outputs/bundle/release -type f -name "*.aab"
          test -n "$(find app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-app-bundle
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/my-upload-key.jks"
