AutoName: LogitNotes
Summary: Bóveda de notas 100% local y cifrada con biometría y Markdown
Description: |-
  LogitNotes es una aplicación de notas y bóveda personal completamente privada,
  de código abierto (FLOSS) y fuera de línea (offline-first).

  Características:
  - Almacenamiento 100% local en tu dispositivo, sin servidores ni rastreadores.
  - Cifrado de grado militar AES-256-GCM y derivación PBKDF2 (100.000 iteraciones).
  - Autenticación biométrica nativa (huella dactilar y reconocimiento facial).
  - Editor y visor de notas en Markdown estándar (.md).
  - Soporte para adjuntar imágenes y documentos cifrados.
  - Copias de seguridad y exportación en Markdown o archivo ZIP completo.
  - Sin contraseñas por defecto: cada usuario define su propia clave maestra.

